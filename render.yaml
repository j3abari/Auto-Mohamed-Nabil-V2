services:
  - type: web
    name: Auto-Mohamed-Nabil-V2
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: Performax
      - key: ADMIN_PASS
        sync: false
      - key: CLIENT_URL
        value: https://auto-mohamed-nabil-v2.onrender.com
      - key: WHATSAPP_NUMBER
        value: "201XXXXXXXXX"
